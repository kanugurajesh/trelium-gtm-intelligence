[project]
name = "trelium-gtm-intelligence"
version = "0.1.0"
description = "Evidence-backed GTM account research utility for the Trelium ICP"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.9",
    "httpx>=0.27",
    "openai>=1.50",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
trelium = "trelium_gtm.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
